<title>编辑器2.0 · 龙黑化</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff}
#app{display:flex;flex-direction:column;height:100vh;background:#12121e}
#topBar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#1a1a2e;border-bottom:1px solid rgba(255,255,255,0.05);flex-shrink:0;min-height:50px}
#topBar .left{display:flex;align-items:center;gap:12px}
#topBar .left .logo{font-size:18px;font-weight:700;color:#ffd700}
#topBar .left .logo span{color:#4488ff}
#topBar .left .info{font-size:12px;color:#6b7f94}
#topBar .right{display:flex;gap:8px;align-items:center}
#topBar .right button{padding:6px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.3s}
#topBar .right .btn-preview{background:#3498db;color:#fff}
#topBar .right .btn-preview:hover{background:#2980b9}
#topBar .right .btn-upload{background:#2ecc71;color:#fff}
#topBar .right .btn-upload:hover{background:#27ae60}
#topBar .right .btn-back{background:rgba(255,255,255,0.05);color:#8a9baa;border:1px solid rgba(255,255,255,0.05)}
#topBar .right .btn-back:hover{background:rgba(255,255,255,0.1)}
#topBar .right .rcoins{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.05);padding:4px 12px;border-radius:16px;font-size:13px;font-weight:600;color:#ffd700;cursor:pointer}
#topBar .right .rcoins img{width:16px;height:16px;vertical-align:middle}
#main{display:flex;flex:1;overflow:hidden}
#filePanel{width:220px;background:#16162a;border-right:1px solid rgba(255,255,255,0.05);display:flex;flex-direction:column;flex-shrink:0}
#filePanel .header{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;font-weight:600;color:#8a9baa;display:flex;justify-content:space-between;align-items:center}
#filePanel .header .count{font-weight:400;font-size:11px;color:#4a5a6a}
#fileList{flex:1;overflow-y:auto;padding:8px}
#fileList::-webkit-scrollbar{width:3px}
#fileList::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:10px}
#fileList .file-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;cursor:pointer;transition:.3s;font-size:13px;color:#c8d0dc}
#fileList .file-item:hover{background:rgba(255,255,255,0.05)}
#fileList .file-item.active{background:rgba(52,152,219,0.15);color:#3498db}
#fileList .file-item .icon{font-size:16px}
#fileList .file-item .name{flex:1;word-break:break-all}
#fileList .file-item .del{background:transparent;border:none;color:#4a5a6a;cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;display:none}
#fileList .file-item:hover .del{display:block}
#fileList .file-item .del:hover{color:#e74c3c;background:rgba(231,76,60,0.1)}
#filePanel .bottom-actions{padding:8px 12px;border-top:1px solid rgba(255,255,255,0.05);display:flex;gap:6px}
#filePanel .bottom-actions button{flex:1;padding:8px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:.3s}
#filePanel .bottom-actions .btn-add{background:rgba(46,204,113,0.15);color:#2ecc71}
#filePanel .bottom-actions .btn-add:hover{background:rgba(46,204,113,0.25)}
#filePanel .bottom-actions .btn-import{background:rgba(52,152,219,0.15);color:#3498db}
#filePanel .bottom-actions .btn-import:hover{background:rgba(52,152,219,0.25)}
#editorPanel{flex:1;display:flex;flex-direction:column;background:#0f0f1a;position:relative}
#editorPanel .mode-tabs{display:flex;background:#1a1a2e;border-bottom:1px solid rgba(255,255,255,0.05);flex-shrink:0}
#editorPanel .mode-tabs .tab{padding:10px 20px;font-size:13px;font-weight:600;color:#6b7f94;cursor:pointer;border-bottom:2px solid transparent;transition:.3s}
#editorPanel .mode-tabs .tab.active{color:#ffd700;border-bottom-color:#ffd700}
#editorPanel .mode-tabs .tab:hover{color:#c8d0dc}
#previewFrame{flex:1;width:100%;border:none;background:#fff}
#editMode{flex:1;display:none;flex-direction:column;padding:16px;overflow-y:auto}
#editMode .edit-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#editMode .edit-toolbar button{padding:6px 14px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:.3s;background:rgba(255,255,255,0.05);color:#8a9baa}
#editMode .edit-toolbar button:hover{background:rgba(255,255,255,0.1)}
#editMode .edit-toolbar button.active{background:rgba(52,152,219,0.2);color:#3498db}
#editMode .edit-code{flex:1;width:100%;background:#0a0a1a;color:#c8d0dc;border:1px solid rgba(255,255,255,0.05);border-radius:8px;padding:16px;font-family:"Courier New",monospace;font-size:14px;resize:none;outline:none;line-height:1.6;tab-size:2}
#editMode .edit-code:focus{border-color:rgba(255,215,0,0.2)}
#propertyPanel{position:fixed;bottom:80px;right:20px;background:#1a1a2e;border:1px solid rgba(255,255,255,0.05);border-radius:12px;padding:16px 20px;min-width:200px;display:none;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
#propertyPanel .title{font-size:13px;font-weight:600;color:#ffd700;margin-bottom:10px}
#propertyPanel .prop-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#propertyPanel .prop-row label{font-size:12px;color:#6b7f94;width:50px}
#propertyPanel .prop-row input{flex:1;padding:4px 8px;border:1px solid rgba(255,255,255,0.05);border-radius:4px;background:rgba(255,255,255,0.05);color:#fff;font-size:12px;outline:none}
#propertyPanel .prop-row input:focus{border-color:#ffd700}
#propertyPanel .prop-row input[type="color"]{padding:0;width:30px;height:30px;border-radius:50%;cursor:pointer}
#propertyPanel .btn-apply{width:100%;padding:6px;border:none;border-radius:6px;background:#ffd700;color:#1a1a2e;font-weight:600;cursor:pointer;margin-top:6px}
#propertyPanel .btn-apply:hover{background:#f0c800}
#propertyPanel .btn-close{position:absolute;top:6px;right:10px;background:transparent;border:none;color:#6b7f94;cursor:pointer;font-size:16px}
#uploadModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:100;display:none;justify-content:center;align-items:center}
#uploadModal .modal{background:#1a1a2e;border-radius:16px;padding:30px;max-width:400px;width:90%;border:1px solid rgba(255,255,255,0.05);max-height:90vh;overflow-y:auto}
#uploadModal .modal h3{color:#ffd700;margin-bottom:6px}
#uploadModal .modal .sub{color:#6b7f94;font-size:13px;margin-bottom:16px}
#uploadModal .modal label{display:block;padding:20px;border:2px dashed rgba(255,255,255,0.05);border-radius:10px;text-align:center;cursor:pointer;transition:.3s;color:#6b7f94}
#uploadModal .modal label:hover{border-color:#ffd700;color:#ffd700}
#uploadModal .modal label input{display:none}
#uploadModal .modal input[type="text"]{width:100%;padding:10px 14px;border:1px solid rgba(255,255,255,0.05);border-radius:8px;background:rgba(255,255,255,0.05);color:#fff;font-size:14px;outline:none;margin-top:12px}
#uploadModal .modal input[type="text"]:focus{border-color:#ffd700}
#uploadModal .modal textarea{width:100%;padding:10px 14px;border:1px solid rgba(255,255,255,0.05);border-radius:8px;background:rgba(255,255,255,0.05);color:#fff;font-size:14px;outline:none;margin-top:12px;min-height:60px;resize:vertical;font-family:inherit}
#uploadModal .modal textarea:focus{border-color:#ffd700}
#uploadModal .modal .btn-group{display:flex;gap:10px;margin-top:12px}
#uploadModal .modal .btn-group button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:.3s}
#uploadModal .modal .btn-group .btn-confirm{background:#ffd700;color:#1a1a2e}
#uploadModal .modal .btn-group .btn-confirm:hover{background:#f0c800}
#uploadModal .modal .btn-group .btn-cancel{background:rgba(255,255,255,0.05);color:#6b7f94}
#uploadModal .modal .btn-group .btn-cancel:hover{background:rgba(255,255,255,0.1)}
#uploadModal .modal .status{padding:10px;border-radius:8px;font-size:13px;text-align:center;margin-top:10px;display:none}
#uploadModal .modal .status.success{background:rgba(46,204,113,0.15);color:#2ecc71;display:block}
#uploadModal .modal .status.error{background:rgba(231,76,60,0.15);color:#e74c3c;display:block}
#uploadModal .modal .status.pending{background:rgba(52,152,219,0.15);color:#3498db;display:block}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 24px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid rgba(255,255,255,0.05)}
#toast.show{opacity:1}
@media(max-width:768px){#filePanel{width:160px}#filePanel .header{font-size:11px;padding:8px 12px}#fileList .file-item{font-size:12px;padding:6px 10px}#topBar .left .logo{font-size:15px}#topBar .right button{font-size:11px;padding:4px 12px}#propertyPanel{right:10px;bottom:70px;min-width:160px;padding:12px 16px}#uploadModal .modal{padding:20px}}

            'toast_create_fail': '❌ Create failed: ',
            'toast_create_net_err': '❌ Create failed',
            'toast_delete_confirm': 'Delete ',
            'toast_delete_confirm2': '?',
            'toast_min_file': '❌ Keep at least one file',
            'toast_cannot_delete_index': '❌ Cannot delete main file',
            'toast_delete_ok': '✅ Deleted: ',
            'toast_delete_fail': '❌ Delete failed: ',
            'toast_delete_net_err': '❌ Delete failed',
            'toast_import_ok': '✅ Imported: ',
            'toast_import_fail': '❌ Import failed: ',
            'toast_import_net_err': '❌ Import failed',
            'toast_import_overwrite': 'File ',
            'toast_import_overwrite2': ' exists, overwrite?',
            'toast_load_fail': '❌ Load failed: ',
            'toast_load_net_err': '❌ Load failed',
            'toast_local_save_ok': '⚠️ Saved locally, server sync failed',
            'toast_icon_too_large': 'Icon must be ≤5MB',
            'toast_no_elem': '❌ Select an element first',
            'toast_prop_applied': '✅ Applied',
            'toast_prop_fail': '⚠️ Apply failed: ',
            'toast_back_confirm': 'Go back? Unsaved changes may be lost.',
            'toast_missing_id': '❌ Missing game ID',
            'toast_upload_ok': '🎉 Game updated, live now',
            'new_file_prompt': 'Enter filename (e.g. style.css):',
            'empty_file_title': 'Empty File',
            'empty_file_h1': 'File is empty',
            'preview_error_title': 'Preview Error',
            'preview_error_h1': 'Preview failed to load',
            'new_page_title': 'New Page',
            'css_comment': '/* Styles */',
            'js_comment': '// JavaScript',
            'my_game_title': 'My Game',
            'editor_2_0': 'Editor 2.0',
            'icon_selected_prefix': 'Icon selected<br><span style="font-size:12px;color:#6b7f94;">',
        }
    },
    t: function(key) {
        var lang = this.currentLang;
        if (this.translations[lang] && this.translations[lang][key] !== undefined) {
            return this.translations[lang][key];
        }
        return key;
    },
    setLanguage: function(lang) {
        this.currentLang = lang;
        try { localStorage.setItem('app_lang', lang); } catch(e) {}
        this.applyLanguage();
    },
    applyLanguage: function() {
        var nodes = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < nodes.length; i++) {
            var key = nodes[i].getAttribute('data-i18n');
            if (key) nodes[i].textContent = this.t(key);
        }
        var phNodes = document.querySelectorAll('[data-i18n-placeholder]');
        for (var j = 0; j < phNodes.length; j++) {
            var pkey = phNodes[j].getAttribute('data-i18n-placeholder');
            if (pkey) phNodes[j].placeholder = this.t(pkey);
        }
        document.title = this.t('page_title');
    },
    init: function() {
        try {
            var saved = localStorage.getItem('app_lang');
            if (saved && this.translations[saved]) {
                this.currentLang = saved;
            }
        } catch(e) {}
        this.applyLanguage();
    }
};
I18N.init();
</script>
</head>
<body>

<div id="app">

<div id="topBar">
    <div class="left">
        <div class="logo">✏️ 龙<span>黑</span>化</div>
        <div class="info" id="projectInfo" data-i18n="project_unnamed">编辑器 2.0 · 未命名</div>
    </div>
    <div class="right">
        <span class="rcoins" onclick="loadRcoins()"><img src="coin.png" alt="R币"> <span id="rcoinsDisplay">0</span></span>
        <button class="btn-back" onclick="goBack()" data-i18n="btn_back">← 返回</button>
        <button class="btn-preview" onclick="togglePreview()" data-i18n="btn_preview">👁️ 预览</button>
        <button class="btn-upload" onclick="openUploadModal()" data-i18n="btn_upload">📤 更新</button>
    </div>
</div>

<div id="main">

    <div id="filePanel">
        <div class="header">
            <span data-i18n="file_panel">📂 文件</span>
            <span class="count" id="fileCount">0</span>
        </div>
        <div id="fileList">
            <div style="text-align:center;color:#4a5a6a;padding:40px 0;font-size:13px;" data-i18n="loading">加载中...</div>
        </div>
        <div class="bottom-actions">
            <button class="btn-add" onclick="createNewFile()" data-i18n="btn_new">📄 新建</button>
            <button class="btn-import" onclick="importFile()" data-i18n="btn_import">📥 导入</button>
        </div>
    </div>

    <div id="editorPanel">
        <div class="mode-tabs">
            <div class="tab active" data-mode="preview" onclick="switchMode('preview')" data-i18n="tab_preview">👁️ 预览</div>
            <div class="tab" data-mode="edit" onclick="switchMode('edit')" data-i18n="tab_edit">✏️ 编辑</div>
        </div>
        
        <iframe id="previewFrame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
        
        <div id="editMode">
            <div class="edit-toolbar" id="editToolbar">
                <button onclick="saveFile()" data-i18n="btn_save">💾 保存</button>
                <button onclick="formatCode()" data-i18n="btn_format">🔧 格式化</button>
                <button onclick="undoAction()" data-i18n="btn_undo">↩️ 撤销</button>
            </div>
            <textarea class="edit-code" id="editCode" spellcheck="false"></textarea>
        </div>
    </div>
</div>

<div id="propertyPanel">
    <button class="btn-close" onclick="closePropertyPanel()">✕</button>
    <div class="title" data-i18n="prop_title">🎨 属性编辑</div>
    <div class="prop-row">
        <label data-i18n="prop_color">颜色</label>
        <input type="color" id="propColor" value="#ffd700">
    </div>
    <div class="prop-row">
        <label data-i18n="prop_size">大小</label>
        <input type="text" id="propSize" placeholder="16px">
    </div>
    <div class="prop-row">
        <label data-i18n="prop_content">内容</label>
        <input type="text" id="propText" placeholder="文本内容">
    </div>
    <button class="btn-apply" onclick="applyProperty()" data-i18n="btn_apply">✅ 应用</button>
</div>

<div id="uploadModal">
    <div class="modal">
        <h3 data-i18n="upload_title">📤 更新作品</h3>
        <div class="sub" data-i18n="upload_sub">上传图标、名称、描述，更新后立即上线</div>
        <label id="uploadLabel" for="uploadIcon">
            <span id="uploadLabelText" data-i18n="upload_click_icon">点击更换图标</span>
            <input type="file" id="uploadIcon" accept="image/*" onchange="previewUploadIcon(event)" style="display:none;">
            <div style="margin-top:8px;font-size:12px;color:#4a5a6a;" data-i18n="upload_icon_hint">支持 JPG/PNG/GIF，≤5MB</div>
        </label>
        <input type="text" id="uploadTitle" placeholder="作品名称（2-20字）" data-i18n-placeholder="upload_title_ph">
        <textarea id="uploadDesc" placeholder="作品描述（可选）" data-i18n-placeholder="upload_desc_ph"></textarea>
        <div id="uploadStatus" class="status"></div>
        <div class="btn-group">
            <button class="btn-confirm" onclick="confirmUpload()" data-i18n="btn_publish">🚀 更新发布</button>
            <button class="btn-cancel" onclick="closeUploadModal()" data-i18n="btn_cancel">取消</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
var API_URL = 'api.php';
var GAME_ID = null;
var CURRENT_FILE = 'index.html';
var FILES = [];
var FILE_CONTENTS = {};
var EDITOR_MODE = 'preview';
var SELECTED_ELEMENT = null;
var HISTORY = [];
var HISTORY_INDEX = -1;
var UPLOAD_ICON_DATA = null;

function getToken() {
    var t = localStorage.getItem('token') || '';
    return t;
}

function getGameIdFromUrl() {
    var params = new URLSearchParams(window.location.search);
    return params.get('id');
}

function showFileContent(filename, content) {
    if(typeof content !== 'string') {
        content = '';
    }
    document.getElementById('editCode').value = content;
    var frame = document.getElementById('previewFrame');
    try {
        if(!content || content.trim() === '') {
            content = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>空文件</title></head><body><h1>文件为空</h1></body></html>';
        }
        frame.srcdoc = content;
    } catch(e) {
        frame.srcdoc = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>预览错误</title></head><body><h1>预览加载失败</h1></body></html>';
    }
    renderFileList();
}

function loadFile(filename) {
    if(!filename) return;
    CURRENT_FILE = filename;
    if(FILE_CONTENTS[filename]) {
        showFileContent(filename, FILE_CONTENTS[filename]);
        renderFileList();
        return;
    }
    var fd = new FormData();
    fd.append('action', 'getEditorFile');
    fd.append('token', getToken());
    fd.append('game_id', GAME_ID);
    fd.append('filename', filename);
    fetch(API_URL, {method:'POST', body:fd})
    .then(function(r){return r.json()})
    .then(function(d){
        if(d.success) {
            FILE_CONTENTS[filename] = d.content || '';
            showFileContent(filename, d.content || '');
        } else {
            showToast(I18N.t('toast_load_fail') + d.message);
            if(filename === 'index.html') {
                createDefaultIndex();
            }
        }
    })
    .catch(function(){
        showToast(I18N.t('toast_load_net_err'));
        if(filename === 'index.html') {
            createDefaultIndex();
        }
    });
}

function createDefaultIndex() {
    var defaultHtml = '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>我的游戏</title>\n<style>\nbody{background:#0a0a1a;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;color:#fff;font-family:Arial,sans-serif;}\n.hello{font-size:48px;color:#ffd700;text-align:center;}\n.hello span{color:#4488ff;}\n</style>\n</head>\n<body>\n<div class="hello">🐉 龙<span>黑</span>化<br><small style="font-size:24px;color:#6b7f94;">编辑器 2.0</small></div>\n</body>\n</html>';
    FILES = ['index.html'];
    FILE_CONTENTS['index.html'] = defaultHtml;
    renderFileList();
    showFileContent('index.html', defaultHtml);
    var fd = new FormData();
    fd.append('action', 'saveEditorFile');
    fd.append('token', getToken());
    fd.append('game_id', GAME_ID);
    fd.append('filename', 'index.html');
    fd.append('content', defaultHtml);
    fetch(API_URL, {method:'POST', body:fd})
    .then(function(r){return r.json()})
    .then(function(d){
        if(!d.success) {
            showToast(I18N.t('toast_local_save_ok'));
        }
    })
    .catch(function(){});
}

function renderFileList() {
    var container = document.getElementById('fileList');
    if(!FILES || FILES.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:#4a5a6a;padding:40px 0;font-size:13px;">'+I18N.t('no_files')+'</div>';
        document.getElementById('fileCount').textContent = '0';
        return;
    }
    var html = '';
    FILES.forEach(function(name) {
        var icon = name.endsWith('.html') ? '🌐' : 
                   name.endsWith('.css') ? '🎨' :
                   name.endsWith('.js') ? '⚡' :
                   name.endsWith('.json') ? '📋' : '📄';
        var active = name === CURRENT_FILE ? 'active' : '';
        html += '<div class="file-item '+active+'" onclick="loadFile(\''+name+'\')">';
        html += '<span class="icon">'+icon+'</span>';
        html += '<span class="name">'+escapeHtml(name)+'</span>';
        html += '<button class="del" onclick="event.stopPropagation();deleteFile(\''+name+'\')">🗑</button>';
        html += '</div>';
    });
    container.innerHTML = html;
    document.getElementById('fileCount').textContent = FILES.length;
}

function saveFile() {
    var content = document.getElementById('editCode').value;
    if(!CURRENT_FILE) {
        showToast(I18N.t('toast_no_file'));
        return;
    }
    pushHistory(content);
    var fd = new FormData();
    fd.append('action', 'saveEditorFile');
    fd.append('token', getToken());
    fd.append('game_id', GAME_ID);
    fd.append('filename', CURRENT_FILE);
    fd.append('content', content);
    fetch(API_URL, {method:'POST', body:fd})
    .then(function(r){return r.json()})
    .then(function(d){
        if(d.success) {
            FILE_CONTENTS[CURRENT_FILE] = content;
            showFileContent(CURRENT_FILE, content);
            showToast(I18N.t('toast_save_success'));
        } else {
            showToast(I18N.t('toast_save_failed') + d.message);
        }
    })
    .catch(function(){
        showToast(I18N.t('toast_save_net_err'));
    });
}

function switchMode(mode) {
    EDITOR_MODE = mode;
    document.querySelectorAll('.mode-tabs .tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.mode === mode);
    });
    document.getElementById('previewFrame').style.display = mode === 'preview' ? 'block' : 'none';
    document.getElementById('editMode').style.display = mode === 'edit' ? 'flex' : 'none';
}

function togglePreview() {
    var currentMode = document.querySelector('.mode-tabs .tab.active').dataset.mode;
    switchMode(currentMode === 'preview' ? 'edit' : 'preview');
}

function pushHistory(content) {
    HISTORY = HISTORY.slice(0, HISTORY_INDEX + 1);
    HISTORY.push(content);
    HISTORY_INDEX = HISTORY.length - 1;
}

function undoAction() {
    if(HISTORY_INDEX > 0) {
        HISTORY_INDEX--;
        var content = HISTORY[HISTORY_INDEX];
        document.getElementById('editCode').value = content;
        FILE_CONTENTS[CURRENT_FILE] = content;
        showFileContent(CURRENT_FILE, content);
        showToast(I18N.t('toast_undo'));
    } else {
        showToast(I18N.t('toast_no_undo'));
    }
}

function formatCode() {
    var code = document.getElementById('editCode').value;
    try {
        var lines = code.split('\n');
        var indent = 0;
        var formatted = [];
        var indentStr = '  ';
        for(var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if(!line) continue;
            if(line.match(/^<\/(?!\w+>)/)) {
                indent = Math.max(0, indent - 1);
            }
            formatted.push(indentStr.repeat(indent) + line);
            if(line.match(/<[^\/][^>]*>/) && !line.match(/<[^\/][^>]*\/>/)) {
                indent++;
            }
        }
        document.getElementById('editCode').value = formatted.join('\n');
        showToast(I18N.t('toast_format_ok'));
    } catch(e) {
        showToast(I18N.t('toast_format_fail'));
    }
}

function createNewFile() {
    var name = prompt(I18N.t('new_file_prompt'));
    if(!name) return;
    if(FILES.indexOf(name) !== -1) {
        showToast(I18N.t('toast_file_exists'));
        return;
    }
    var content = '';
    if(name.endsWith('.html')) {
        content = '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<title>新页面</title>\n</head>\n<body>\n\n</body>\n</html>';
    } else if(name.endsWith('.css')) {
        content = '/* 样式文件 */\n';
    } else if(name.endsWith('.js')) {
        content = '// JavaScript 文件\n';
    }
    var fd = new FormData();
    fd.append('action', 'saveEditorFile');
    fd.append('token', getToken());
    fd.append('game_id', GAME_ID);
    fd.append('filename', name);
    fd.append('content', content);
    fetch(API_URL, {method:'POST', body:fd})
    .then(function(r){return r.json()})
    .then(function(d){
        if(d.success) {
            FILES.push(name);
            FILE_CONTENTS[name] = content;
            renderFileList();
            loadFile(name);
            showToast(I18N.t('toast_create_ok') + name);
        } else {
            showToast(I18N.t('toast_create_fail') + d.message);
        }
    })
    .catch(function(){
        showToast(I18N.t('toast_create_net_err'));
    });
}

function deleteFile(filename) {
    if(!confirm(I18N.t('toast_delete_confirm') + filename + I18N.t('toast_delete_confirm2'))) return;
    if(FILES.length <= 1) {
        showToast(I18N.t('toast_min_file'));
        return;
    }
    if(filename === 'index.html') {
        showToast(I18N.t('toast_cannot_delete_index'));
        return;
    }
    var fd = new FormData();
    fd.append('action', 'deleteEditorFile');
    fd.append('token', getToken());
    fd.append('game_id', GAME_ID);
    fd.append('filename', filename);
    fetch(API_URL, {method:'POST', body:fd})
    .then(function(r){return r.json()})
    .then(function(d){
        if(d.success) {
            var idx = FILES.indexOf(filename);
            if(idx !== -1) FILES.splice(idx, 1);
            delete FILE_CONTENTS[filename];
            if(CURRENT_FILE === filename) {
                CURRENT_FILE = FILES[0] || '';
                if(CURRENT_FILE) loadFile(CURRENT_FILE);
            }
            renderFileList();
            showToast(I18N.t('toast_delete_ok') + filename);
        } else {
            showToast(I18N.t('toast_delete_fail') + d.message);
        }
    })
    .catch(function(){
        showToast(I18N.t('toast_delete_net_err'));
    });
}

function importFile() {
    var input = document.createElement('input');
    input.type = 'file';
    input.onchange = function(e) {
        var file = e.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            var name = file.name;
            var content = ev.target.result;
            if(FILES.indexOf(name) !== -1) {
                if(!confirm(I18N.t('toast_import_overwrite') + name + I18N.t('toast_import_overwrite2'))) return;
            }
            var fd = new FormData();
            fd.append('action', 'saveEditorFile');
            fd.append('token', getToken());
            fd.append('game_id', GAME_ID);
            fd.append('filename', name);
            fd.append('content', content);
            fetch(API_URL, {method:'POST', body:fd})
            .then(function(r){return r.json()})
            .then(function(d){
                if(d.success) {
                    if(FILES.indexOf(name) === -1) FILES.push(name);
                    FILE_CONTENTS[name] = content;
                    renderFileList();
                    loadFile(name);
                    showToast(I18N.t('toast_import_ok') + name);
                } else {
                    showToast(I18N.t('toast_import_fail') + d.message);
                }
            })
            .catch(function(){
                showToast(I18N.t('toast_import_net_err'));
            });
        };
        reader.readAsText(file);
    };
    input.click();
}

function previewUploadIcon(e) {
    var file = e.target.files[0];
    if(!file) return;
    if(file.size > 5 * 1024 * 1024) {
        showToast(I18N.t('toast_icon_too_large'));
        e.target.value = '';
        return;
    }
    var reader = new FileReader();
    reader.onload = function(ev) {
        UPLOAD_ICON_DATA = ev.target.result;
        document.getElementById('uploadLabel').style.borderColor = '#ffd700';
        document.getElementById('uploadLabelText').innerHTML = I18N.t('icon_selected_prefix') + file.name + '</span>';
    };
    reader.readAsDataURL(file);
}

function openUploadModal() {
    document.getElementById('uploadModal').style.display = 'flex';
    document.getElementById('uploadStatus').style.display = 'none';
    document.getElementById('uploadStatus').className = 'status';
    document.getElementById('uploadTitle').value = '';
    document.getElementById('uploadDesc').value = '';
    document.getElementById('uploadIcon').value = '';
    UPLOAD_ICON_DATA = null;
    document.getElementById('uploadLabel').style.borderColor = 'rgba(255,255,255,0.05)';
    document.getElementById('uploadLabelText').innerHTML = I18N.t('upload_click_icon');
}

function closeUploadModal() {
    document.getElementById('uploadModal').style.display = 'none';
}

function setupPropertyEditor() {
    var frame = document.getElementById('previewFrame');
    frame.addEventListener('load', function() {
        try {
            var doc = frame.contentDocument || frame.contentWindow.document;
            if(!doc) return;
            var elements = doc.querySelectorAll('*');
            elements.forEach(function(el) {
                if(el === doc.body || el === doc.documentElement) return;
                el.addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                    SELECTED_ELEMENT = el;
                    openPropertyPanel(el);
                });
                var timer = null;
                el.addEventListener('touchstart', function(e) {
                    timer = setTimeout(function() {
                        SELECTED_ELEMENT = el;
                        openPropertyPanel(el);
                    }, 600);
                });
                el.addEventListener('touchend', function() { clearTimeout(timer); });
                el.addEventListener('touchmove', function() { clearTimeout(timer); });
            });
        } catch(e) {}
    });
}

function openPropertyPanel(el) {
    var panel = document.getElementById('propertyPanel');
    panel.style.display = 'block';
    var color = el.style.color || getComputedStyle(el).color || '#ffd700';
    var fontSize = el.style.fontSize || getComputedStyle(el).fontSize || '16px';
    var text = el.textContent || '';
    document.getElementById('propColor').value = rgbToHex(color);
    document.getElementById('propSize').value = fontSize;
    document.getElementById('propText').value = text;
}

function rgbToHex(rgb) {
    if(!rgb) return '#ffd700';
    var match = rgb.match(/\d+/g);
    if(!match) return '#ffd700';
    var r = parseInt(match[0]);
    var g = parseInt(match[1]);
    var b = parseInt(match[2]);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function closePropertyPanel() {
    document.getElementById('propertyPanel').style.display = 'none';
    SELECTED_ELEMENT = null;
}

function applyProperty() {
    if(!SELECTED_ELEMENT) {
        showToast(I18N.t('toast_no_elem'));
        return;
    }
    var color = document.getElementById('propColor').value;
    var size = document.getElementById('propSize').value;
    var text = document.getElementById('propText').value;
    try {
        var frame = document.getElementById('previewFrame');
        var doc = frame.contentDocument || frame.contentWindow.document;
        if(!doc) return;
        var el = doc.querySelector('[data-editor-id]');
        if(!el) {
            var allEls = doc.querySelectorAll('*');
            for(var i = 0; i < allEls.length; i++) {
                if(allEls[i].textContent === SELECTED_ELEMENT.textContent && 
                   allEls[i].tagName === SELECTED_ELEMENT.tagName) {
                    el = allEls[i];
                    break;
                }
            }
        }
        if(!el) el = SELECTED_ELEMENT;
        if(color) el.style.color = color;
        if(size) el.style.fontSize = size;
        if(text && el.textContent !== undefined) {
            var childNodes = el.childNodes;
            var hasTextChild = false;
            for(var j = 0; j < childNodes.length; j++) {
                if(childNodes[j].nodeType === 3) {
                    childNodes[j].textContent = text;
                    hasTextChild = true;
                    break;
                }
            }
            if(!hasTextChild) {
                el.textContent = text;
            }
        }
        var html = doc.documentElement.outerHTML;
        document.getElementById('editCode').value = html;

function injectSystemAdapter(originalCode, title) {
    if (originalCode.indexOf('龙黑化系统适配') !== -1) {
        return originalCode;
    }
    var adapterHTML = getSystemAdapterHTML();
    var bodyMatch = originalCode.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
    if (bodyMatch) {
        var newBody = bodyMatch[1] + '<!-- 龙黑化系统适配 -->' + adapterHTML;
        return originalCode.replace(bodyMatch[0], '<body>' + newBody + '</body>');
    } else {
        return originalCode + '<!-- 龙黑化系统适配 -->' + adapterHTML;
    }
}

function confirmUpload() {
    var title = document.getElementById('uploadTitle').value.trim();
    var desc = document.getElementById('uploadDesc').value.trim();
    var statusEl = document.getElementById('uploadStatus');
    if(!title || title.length < 2 || title.length > 20) {
        statusEl.textContent = I18N.t('err_title_len');
        statusEl.className = 'status error';
        statusEl.style.display = 'block';
        return;
    }
    if(!UPLOAD_ICON_DATA) {
        statusEl.textContent = I18N.t('err_no_icon');
        statusEl.className = 'status error';
        statusEl.style.display = 'block';
        return;
    }
    statusEl.textContent = I18N.t('uploading');
    statusEl.className = 'status pending';
    statusEl.style.display = 'block';
    var content = document.getElementById('editCode').value;
    if(CURRENT_FILE && content !== FILE_CONTENTS[CURRENT_FILE]) {
        var fd = new FormData();
        fd.append('action', 'saveEditorFile');
        fd.append('token', getToken());
        fd.append('game_id', GAME_ID);
        fd.append('filename', CURRENT_FILE);
        fd.append('content', content);
        fetch(API_URL, {method:'POST', body:fd}).catch(function(){});
    }
    var gameCode = FILE_CONTENTS['index.html'] || '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>游戏</title></head><body></body></html>';
    var adaptedCode = injectSystemAdapter(gameCode, title);
    var fd2 = new FormData();
    fd2.append('action', 'updateEditorGame');
    fd2.append('token', getToken());
    fd2.append('game_id', GAME_ID);
    fd2.append('title', title);
    fd2.append('description', desc);
    fd2.append('code', adaptedCode);
    fd2.append('icon_data', UPLOAD_ICON_DATA);
    fetch(API_URL, {method:'POST', body:fd2})
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if(d.success) {
            statusEl.textContent = I18N.t('upload_success');
            statusEl.className = 'status success';
            setTimeout(function() {
                closeUploadModal();
                showToast(I18N.t('toast_upload_ok'));
                window.location.href = 'dashboard.html';
            }, 1500);
        } else {
            statusEl.textContent = I18N.t('upload_failed') + d.message;
            statusEl.className = 'status error';
        }
    })
    .catch(function(err) {
        statusEl.textContent = I18N.t('network_error');
        statusEl.className = 'status error';
        console.error('上传错误:', err);
    });
}

function loadRcoins() {
    var token = getToken();
    if (!token) return;
    var fd = new FormData();
    fd.append('action','getRcoins');
    fd.append('token',token);
    fetch(API_URL,{method:'POST',body:fd})
    .then(function(r){return r.json()})
    .then(function(d){
        if(d.success){
            document.getElementById('rcoinsDisplay').textContent = d.rcoins || 0;
        }
    })
    .catch(function(){});
}

function escapeHtml(text) {
    if(!text) return '';
    var d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}

function showToast(text) {
    var el = document.getElementById('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer = setTimeout(function() {
        el.classList.remove('show');
    }, 3000);
}

function init() {
    GAME_ID = getGameIdFromUrl();
    if (!GAME_ID) {
        showToast(I18N.t('toast_missing_id'));
        setTimeout(function(){ window.location.href = 'dashboard.html'; }, 1500);
        return;
    }
    document.getElementById('projectInfo').textContent = I18N.t('project_info') + GAME_ID;
    loadRcoins();
    var fd = new FormData();
    fd.append('action', 'getEditorFiles');
    fd.append('token', getToken());
    fd.append('game_id', GAME_ID);
    fetch(API_URL, {method:'POST', body:fd})
    .then(function(r){return r.json()})
    .then(function(d){
        if(d.success && d.files && d.files.length > 0) {
            FILES = d.files;
            renderFileList();
            if(FILES.indexOf('index.html') !== -1) {
                loadFile('index.html');
            } else {
                loadFile(FILES[0]);
            }
        } else {
            createDefaultIndex();
        }
    })
    .catch(function(){
        createDefaultIndex();
    });
}

init();

document.getElementById('previewFrame').addEventListener('load', setupPropertyEditor);

document.addEventListener('keydown', function(e) {
    if((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        if(EDITOR_MODE === 'edit') saveFile();
    }
    if((e.ctrlKey || e.metaKey) && e.key === 'z') {
        e.preventDefault();
        undoAction();
    }
    if(e.key === 'Escape') {
        closePropertyPanel();
        closeUploadModal();
    }
});
